[package]
name = "fadera-ide"
version = "0.8.2"
edition = "2021"
description = "Fadéra IDE — fenêtre native (WebView2) pour l'éditeur Fadéra"
license = "MIT"

# Application graphique (sans console) : Windows uniquement. Ailleurs, le programme se contente d'un message.
[target.'cfg(windows)'.dependencies]
wry = "0.47"
tao = "0.30"
png = "0.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
