<title>Apprendre Fadéra</title>
<meta name="description" content="Apprendre à programmer en français avec Fadéra : dix leçons courtes, des exercices corrigés automatiquement dans le navigateur, sans compte ni installation.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%230f1b33'/%3E%3Cpath d='M86 204V70a14 14 0 0 1 14-14h92M86 130h74' fill='none' stroke='%23f2a93b' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='176' y='164' width='40' height='40' rx='8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
:root {
  --bg: #f6f7fa; --surface: #ffffff; --fg: #0f1b33; --muted: #55627c; --line: #d9deea;
  --accent: #b9650a; --accent-bg: #f2a93b; --accent-fg: #0f1b33;
  --ok: #17794a; --ok-bg: #e3f5ec; --ko: #b3261e; --ko-bg: #fdecea;
  --code-bg: #0f1b33; --code-fg: #e8edf5; --code-dim: #8d9bb8;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1426; --surface: #121f3a; --fg: #e8edf5; --muted: #9fadc9; --line: #22335a;
    --accent: #f2a93b; --ok: #6fd6a0; --ok-bg: #12301f; --ko: #ff9a92; --ko-bg: #3a1714; --code-bg: #08101f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1426; --surface: #121f3a; --fg: #e8edf5; --muted: #9fadc9; --line: #22335a;
  --accent: #f2a93b; --ok: #6fd6a0; --ok-bg: #12301f; --ko: #ff9a92; --ko-bg: #3a1714; --code-bg: #08101f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--body); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
a { color: inherit; }
code, pre, textarea { font-family: var(--mono); }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
:focus-visible { outline: 3px solid var(--accent-bg); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; flex-wrap: wrap; }
.marque { display: flex; align-items: center; gap: 10px; font: 800 1.3rem var(--display); text-decoration: none; }
.marque svg { width: 32px; height: 32px; }
.marque small { font: 500 .85rem var(--body); color: var(--muted); }
nav.liens { display: flex; gap: 18px; font-size: .95rem; flex-wrap: wrap; }
nav.liens a { color: var(--muted); text-decoration: none; }
nav.liens a:hover { color: var(--fg); }
.mise { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; padding-bottom: 64px; align-items: start; }
@media (max-width: 820px) { .mise { grid-template-columns: minmax(0, 1fr); } }
aside { position: sticky; top: 12px; }
@media (max-width: 820px) { aside { position: static; } }
.progres { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.progres .barre { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 4px; }
.progres .barre i { display: block; height: 100%; width: 0; background: var(--accent-bg); transition: width .3s; }
.progres p { margin: 0; font-size: .9rem; color: var(--muted); }
.chap { margin: 18px 0 6px; font: 600 .78rem var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.liste { list-style: none; margin: 0; padding: 0; }
.liste a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: .96rem; }
.liste a:hover { background: var(--surface); }
.liste a[aria-current="page"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent-bg); font-weight: 600; }
.puce { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .72rem; line-height: 1; color: var(--ok); }
.fait .puce { border-color: var(--ok); background: var(--ok-bg); }
article { min-width: 0; }
article h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; }
.etiquette { color: var(--accent); font: 600 .85rem var(--body); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.texte { margin-top: 16px; }
.texte p { margin: 0 0 12px; max-width: 42em; }
.texte code, .consigne code { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: .9em; }
pre.exemple { background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 16px; margin: 14px 0 6px; overflow-x: auto; font-size: .92rem; line-height: 1.55; }
.legende { font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
section.exo { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
section.exo h2 { font-size: 1.3rem; }
.consigne { margin: 10px 0 14px; max-width: 46em; }
textarea { display: block; width: 100%; min-height: 190px; resize: vertical; background: var(--code-bg); color: var(--code-fg); border: 2px solid transparent; border-radius: 10px; padding: 14px; font-size: .95rem; line-height: 1.55; tab-size: 4; }
textarea:focus { border-color: var(--accent-bg); outline: none; }
.saisies { margin-top: 10px; display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
.saisies input { font: .92rem var(--mono); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.boutons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
button { font: 600 .95rem var(--body); padding: 10px 18px; border-radius: 10px; border: 2px solid var(--fg); background: transparent; color: var(--fg); cursor: pointer; }
button:hover { background: var(--fg); color: var(--bg); }
button.plein { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--accent-fg); }
button.plein:hover { filter: brightness(1.06); background: var(--accent-bg); color: var(--accent-fg); }
button:disabled { opacity: .5; cursor: wait; }
.sortie { margin-top: 14px; border-radius: 10px; padding: 14px 16px; font-size: .95rem; }
.sortie:empty { display: none; }
.sortie.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.sortie.ko { background: var(--ko-bg); color: var(--ko); border: 1px solid var(--ko); }
.sortie.neutre { background: var(--bg); border: 1px solid var(--line); color: var(--fg); }
.sortie pre { margin: 8px 0 0; font-size: .9rem; white-space: pre-wrap; color: inherit; }
.sortie strong { font-weight: 700; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
@media (max-width: 560px) { .cmp { grid-template-columns: minmax(0, 1fr); } }
.cmp h4 { margin: 0 0 4px; font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .05em; }
.aide { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--accent-bg); background: var(--bg); border-radius: 0 8px 8px 0; font-size: .95rem; }
.aide[hidden] { display: none; }
.aide pre { margin: 8px 0 0; font-size: .9rem; white-space: pre-wrap; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
.etat-moteur { font-size: .85rem; color: var(--muted); margin-top: 12px; }
.etat-moteur.err { color: var(--ko); }
.discret { font-size: .85rem; color: var(--muted); margin-top: 18px; }
.discret button { font-size: .82rem; padding: 4px 10px; border-width: 1px; }
</style>
<body>
<div class="wrap">
  <header class="top">
    <a class="marque" href="../" aria-label="Fadéra, accueil">
      <svg viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="56" fill="#0f1b33"/><path d="M86 204V70a14 14 0 0 1 14-14h92M86 130h74" fill="none" stroke="#f2a93b" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><rect x="176" y="164" width="40" height="40" rx="8" fill="#fff"/></svg>
      Fadéra <small>Apprendre</small>
    </a>
    <nav class="liens" aria-label="Navigation">
      <a href="../">Accueil</a>
      <a href="../jouer/">Éditeur en ligne</a>
      <a href="https://github.com/Faderaseny/fadera/blob/main/GUIDE_FADERA.md">Guide complet</a>
    </nav>
  </header>

  <div class="mise">
    <aside aria-label="Sommaire des leçons">
      <div class="progres">
        <strong id="progres-titre">0 / 0 exercices réussis</strong>
        <div class="barre"><i id="progres-barre"></i></div>
        <p>Ta progression reste dans ce navigateur : aucun compte, aucune donnée envoyée.</p>
      </div>
      <nav id="sommaire" aria-label="Leçons"></nav>
    </aside>

    <article id="lecon" aria-live="polite"></article>
  </div>
</div>

<script src="cours.js"></script>
<script src="correcteur.js"></script>
<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const echapper = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const CLE = "fadera-apprendre/1";
  // --- progression (localStorage facultatif : la page marche sans) ---
  let etat = { faits: {}, codes: {} };
  try { const s = JSON.parse(localStorage.getItem(CLE) || "null"); if (s && s.faits) etat = { faits: s.faits || {}, codes: s.codes || {} }; } catch (e) {}
  const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} };

  // --- moteur Fadéra (WebAssembly), chargé une seule fois ---
  let moteur = null, erreurMoteur = null;
  const promesseMoteur = (async () => {
    try {
      const M = await import("../jouer/pkg/fadera.js");
      await M.default();
      moteur = M;
    } catch (e) { erreurMoteur = e; }
  })();
  const executer = (code, saisies) => moteur.executer(code, saisies);

  // --- sommaire ---
  function dessinerSommaire(courant) {
    let html = "", chap = "";
    COURS.forEach((l) => {
      if (l.chapitre !== chap) { if (chap) html += "</ul>"; chap = l.chapitre; html += `<div class="chap">${echapper(chap)}</div><ul class="liste">`; }
      html += `<li class="${etat.faits[l.id] ? "fait" : ""}"><a href="#${l.id}" ${l.id === courant ? 'aria-current="page"' : ""}><span class="puce" aria-hidden="true">${etat.faits[l.id] ? "✓" : ""}</span>${echapper(l.titre)}${etat.faits[l.id] ? '' : ""}</a></li>`;
    });
    $("#sommaire").innerHTML = html + "</ul>";
    const n = COURS.filter((l) => etat.faits[l.id]).length;
    $("#progres-titre").textContent = n + " / " + COURS.length + " exercices réussis";
    $("#progres-barre").style.width = (100 * n / COURS.length) + "%";
  }

  // --- leçon ---
  function afficherLecon() {
    const id = location.hash.slice(1);
    let i = COURS.findIndex((l) => l.id === id);
    if (i < 0) i = Math.max(0, COURS.findIndex((l) => !etat.faits[l.id]));
    const l = COURS[i];
    document.title = l.titre + " — Apprendre Fadéra";
    dessinerSommaire(l.id);
    const precedent = COURS[i - 1], suivant = COURS[i + 1];
    $("#lecon").innerHTML = `
      <div class="etiquette">Leçon ${i + 1} sur ${COURS.length} · ${echapper(l.chapitre)}</div>
      <h1>${echapper(l.titre)}</h1>
      <div class="texte">${l.lecon}</div>
      <div class="legende">Exemple</div>
      <pre class="exemple"><code>${echapper(l.exemple)}</code></pre>
      <div class="boutons"><button type="button" id="essayer">Essayer cet exemple dans l'éditeur ci-dessous</button></div>
      <section class="exo" aria-labelledby="titre-exo">
        <h2 id="titre-exo">À toi de jouer</h2>
        <div class="consigne">${l.consigne}</div>
        
        <textarea id="code" aria-label="Ton code Fadéra" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="titre-exo"></textarea>
        <div class="saisies"><label for="entrees">Pour « Exécuter » : réponses aux <code>saisir</code>, une par ligne (facultatif)</label><input id="entrees" type="text" placeholder="ex. 8, 5 : sépare les réponses par des virgules" autocomplete="off"></div>
        <div class="boutons">
          <button type="button" class="plein" id="verifier">Vérifier</button>
          <button type="button" id="executer">Exécuter</button>
          <button type="button" id="indice">Un indice</button>
          <button type="button" id="remise">Repartir de zéro</button>
        </div>
        <div class="sortie" id="sortie" role="status"></div>
        <div class="aide" id="aide" hidden></div>
        <div class="etat-moteur" id="etat-moteur"></div>
      </section>
      <div class="nav">
        ${precedent ? `<a href="#${precedent.id}"><button type="button">← ${echapper(precedent.titre)}</button></a>` : "<span></span>"}
        ${suivant ? `<a href="#${suivant.id}"><button type="button" class="${etat.faits[l.id] ? "plein" : ""}">${echapper(suivant.titre)} →</button></a>` : "<span></span>"}
      </div>
      <p class="discret">Envie de plus de liberté ? Ouvre l'<a href="../jouer/">éditeur en ligne</a>. <button type="button" id="effacer">Effacer toute ma progression</button></p>`;
    window.scrollTo(0, 0);

    const zone = $("#code"), sortie = $("#sortie"), aide = $("#aide"), msg = $("#etat-moteur");
    zone.value = etat.codes[l.id] != null ? etat.codes[l.id] : l.depart;
    zone.addEventListener("input", () => { etat.codes[l.id] = zone.value; sauver(); });
    // Tab insère 4 espaces (Échap puis Tab pour quitter la zone au clavier)
    let tabLibre = false;
    zone.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { tabLibre = true; return; }
      if (e.key === "Tab" && !e.shiftKey && !tabLibre) {
        e.preventDefault();
        const a = zone.selectionStart, b = zone.selectionEnd;
        zone.setRangeText("    ", a, b, "end"); zone.dispatchEvent(new Event("input"));
      } else if (e.key !== "Shift") tabLibre = false;
    });
    $("#essayer").onclick = () => { zone.value = l.exemple; zone.dispatchEvent(new Event("input")); zone.focus(); };
    $("#remise").onclick = () => { if (!zone.value.trim() || zone.value === l.depart || confirm("Repartir du code de départ ? Ton code actuel sera perdu.")) { zone.value = l.depart; zone.dispatchEvent(new Event("input")); sortie.className = "sortie"; sortie.innerHTML = ""; } };
    let nbEchecs = 0, solutionVue = false;
    $("#indice").onclick = () => {
      aide.hidden = false;
      let h = "<strong>Indice :</strong> " + l.indice;
      if (nbEchecs >= 3) h += `<div style="margin-top:8px"><button type="button" id="voirsol">Voir une solution</button></div>`;
      else h += `<div class="legende" style="margin-top:6px">Essaie encore quelques fois : une solution apparaîtra ici après 3 vérifications ratées.</div>`;
      aide.innerHTML = h;
      const b = $("#voirsol"); if (b) b.onclick = () => { solutionVue = true; aide.innerHTML = "<strong>Une solution possible :</strong><pre>" + echapper(l.solution) + "</pre>"; };
    };
    $("#effacer").onclick = () => { if (confirm("Effacer toute ta progression et tous tes codes sur cet appareil ?")) { etat = { faits: {}, codes: {} }; sauver(); afficherLecon(); } };

    async function pret() {
      const b1 = $("#verifier"), b2 = $("#executer");
      b1.disabled = b2.disabled = true; msg.className = "etat-moteur"; msg.textContent = "Chargement du moteur Fadéra…";
      await promesseMoteur;
      b1.disabled = b2.disabled = false;
      if (!moteur) {
        msg.className = "etat-moteur err";
        msg.innerHTML = "Le moteur Fadéra n'a pas pu être chargé (" + echapper(erreurMoteur && erreurMoteur.message || "pkg introuvable") + "). Ouvre la page depuis le site officiel, ou essaie ton code dans l'<a href=\"../jouer/\">éditeur en ligne</a>.";
        b1.disabled = b2.disabled = true; return false;
      }
      msg.textContent = ""; return true;
    }
    pret();

    $("#executer").onclick = async () => {
      if (!(await pret())) return;
      const saisies = $("#entrees").value.split(",").map((s) => s.trim()).filter((s, k, t) => s !== "" || k < t.length - 1);
      const r = JSON.parse(executer(zone.value, $("#entrees").value.trim() ? saisies : []));
      sortie.className = "sortie " + (r.erreur ? "ko" : "neutre");
      sortie.innerHTML = r.erreur
        ? "<strong>Erreur</strong><pre>" + echapper(r.erreur) + (r.source ? "\n" + echapper(r.source) : "") + "</pre>"
        : "<strong>Résultat</strong><pre>" + (r.sortie.length ? echapper(r.sortie.join("\n")) : "(rien n'a été affiché)") + "</pre>";
    };

    $("#verifier").onclick = async () => {
      if (!(await pret())) return;
      const res = Correcteur.corriger(l, zone.value, executer);
      if (res.reussi) {
        const premiere = !etat.faits[l.id];
        etat.faits[l.id] = true; etat.codes[l.id] = zone.value; sauver(); dessinerSommaire(l.id);
        sortie.className = "sortie ok";
        sortie.innerHTML = "<strong>Bravo, c'est réussi !</strong> Ton programme a donné la bonne réponse sur les " + res.details.length + " tests." + (solutionVue ? " (Tu avais regardé la solution : essaie de la refaire de mémoire demain.)" : "") + (suivant ? ` <a href="#${suivant.id}"><strong>Leçon suivante →</strong></a>` : " <strong>Tu as terminé le parcours ! 🎉</strong>");
        return;
      }
      nbEchecs++;
      sortie.className = "sortie ko";
      if (res.erreur) {
        sortie.innerHTML = "<strong>Ton programme contient une erreur</strong><pre>" + echapper(res.erreur) + (res.source ? "\n" + echapper(res.source) : "") + "</pre>";
        return;
      }
      const d = res.details.find((x) => !x.ok);
      const bloc = (t, lignes) => `<div><h4>${t}</h4><pre>${lignes.length ? echapper(lignes.join("\n")) : "(rien)"}</pre></div>`;
      sortie.innerHTML = "<strong>Pas encore.</strong> " + (d.saisies.length ? "Avec les réponses saisies <code>" + echapper(d.saisies.join(", ")) + "</code>, " : "") + "ton programme n'affiche pas ce qui est attendu." +
        `<div class="cmp">${bloc("Attendu", d.attendu)}${bloc("Obtenu", d.obtenu)}</div>`;
    };
  }
  window.addEventListener("hashchange", afficherLecon);
  afficherLecon();
})();
</script>
